name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Extract app project
        run: |
          unzip -q GroceryReceiptApp_Android_PhoneBuild_FIXED.zip -d extracted
          test -f extracted/GroceryReceiptApp/settings.gradle.kts

      - name: Build debug APK
        working-directory: extracted/GroceryReceiptApp
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroceryReceiptApp-debug-apk
          path: extracted/GroceryReceiptApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
